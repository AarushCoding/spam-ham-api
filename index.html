<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spam Guard v1.0</title>
    <style>
        :root { 
            --bg: #0a0a0a; 
            --surface: #1a1a1a;
            --accent: #ffffff; 
            --grey-text: #b0b0b0; 
            --muted: #888888;
            --orange: #ff9500; /* Alarm color */
            --safe: #4ade80;   /* Ham color */
            --danger: #f87171; /* Spam color */
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg); color: var(--accent); 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; margin: 0;
        }

        .container { width: 90%; max-width: 450px; padding: 20px; }

        h1 { 
            font-weight: 300; letter-spacing: 4px; font-size: 13px; 
            text-align: center; text-transform: uppercase; margin-bottom: 50px;
        }
        
        textarea {
            width: 100%; background: transparent; border: none;
            border-bottom: 1px solid var(--surface); color: var(--accent);
            padding: 12px 0; font-size: 18px; outline: none;
            resize: none; transition: 0.4s; font-family: inherit;
        }
        textarea:focus { border-bottom: 1px solid var(--orange); }

        button { 
            background: transparent; color: var(--accent); 
            border: 1px solid var(--muted); padding: 14px; 
            margin-top: 20px; cursor: pointer; width: 100%;
            font-size: 10px; letter-spacing: 3px; text-transform: uppercase; transition: 0.3s;
        }
        button:hover { border-color: var(--orange); color: var(--orange); }

        .result-box { 
            margin-top: 50px; text-align: center; 
            display: {% if prediction %} block {% else %} none {% endif %};
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .label { font-size: 10px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; }
        .verdict { font-size: 52px; font-weight: 800; margin: 10px 0; letter-spacing: -1px; }

        .track { width: 100%; height: 2px; background: var(--surface); margin: 30px 0; position: relative; }
        .pointer {
            position: absolute; width: 12px; height: 12px; border-radius: 50%; top: -5px;
            left: {{ probability }}%; /* This comes from Python */
            background: {% if prediction == 'SPAM' %} var(--danger) {% else %} var(--safe) {% endif %};
            transition: left 1s ease; transform: translateX(-50%);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Inbound Security Engine</h1>
        
        <form action="/predict" method="POST">
            <textarea name="content" rows="3" placeholder="Paste email source...">{{ text }}</textarea>
            <button type="submit">Scan for Threats</button>
        </form>

        <div class="result-box">
            <div class="label">Analysis Verdict</div>
            <div class="verdict" style="color: {% if prediction == 'SPAM' %} var(--danger) {% else %} var(--safe) {% endif %};">
                {{ prediction }}
            </div>
            
            <div class="track">
                <div class="pointer"></div>
            </div>

            <div class="label" style="letter-spacing: 1px;">Threat Probability: {{ probability }}%</div>
        </div>
    </div>
</body>
</html>

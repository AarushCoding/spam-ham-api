<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spam Guard</title>
    <style>
        :root { 
            --bg: #0a0a0a; --surface: #1a1a1a; --accent: #ffffff; 
            --grey-text: #b0b0b0; --muted: #888888; --orange: #ff9500;
            --pos: #4ade80; --neg: #f87171;
        }
        body { 
            font-family: -apple-system, sans-serif; background: var(--bg); color: var(--accent);
            display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;
        }
        .container { width: 90%; max-width: 450px; }
        h1 { font-weight: 300; letter-spacing: 4px; font-size: 11px; text-align: center; text-transform: uppercase; margin-bottom: 50px; }
        textarea {
            width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--surface);
            color: var(--accent); padding: 12px 0; font-size: 20px; outline: none; resize: none;
        }
        textarea:focus { border-bottom: 1px solid var(--orange); }
        button { 
            background: transparent; color: var(--accent); border: 1px solid var(--muted);
            padding: 14px; width: 100%; font-size: 10px; letter-spacing: 3px;
            text-transform: uppercase; margin-top: 20px; cursor: pointer;
        }
        button:hover { border-color: var(--orange); color: var(--orange); }
        .result-box { margin-top: 50px; display: none; text-align: center; }
        .vibe-label { font-size: 10px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; }
        .vibe-text { font-size: 52px; font-weight: 800; margin: 10px 0; }
        .score-track { width: 100%; height: 2px; background: var(--surface); margin: 30px 0; position: relative; }
        #pointer { 
            position: absolute; width: 12px; height: 12px; background: white; 
            border-radius: 50%; top: -5px; left: 50%; transform: translateX(-50%); transition: 0.8s;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Inbound Security v1.0</h1>
        <textarea id="input" rows="1" placeholder="Enter email text..." oninput="this.style.height='';this.style.height=this.scrollHeight+'px'"></textarea>
        <button onclick="checkSecurity()">Scan Message</button>
        <div id="resultBox" class="result-box">
            <div class="vibe-label">Verdict</div>
            <div id="vibe" class="vibe-text">-</div>
            <div class="score-track"><div id="pointer"></div></div>
            <div id="stats" style="font-size: 11px; color: var(--grey-text); letter-spacing: 1px; text-transform: uppercase;"></div>
        </div>
    </div>
    <script>
        async function checkSecurity() {
            const text = document.getElementById('input').value;
            if(!text) return;
            const res = await fetch('/analyze', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({text})
            });
            const data = await res.json();
            document.getElementById('resultBox').style.display = 'block';
            document.getElementById('vibe').innerText = data.verdict.toUpperCase();
            const color = data.verdict === "Spam" ? "var(--neg)" : "var(--pos)";
            document.getElementById('vibe').style.color = color;
            document.getElementById('pointer').style.background = color;
            document.getElementById('pointer').style.left = (data.score * 100) + '%';
            document.getElementById('stats').innerText = `Threat Level: ${Math.round(data.score*100)}% | Confidence: ${data.confidence}`;
        }
    </script>
</body>
</html>
